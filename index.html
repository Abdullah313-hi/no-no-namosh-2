<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Finding No-No-Namosh II: The Lost Star</title>
<link rel="stylesheet" href="src/style.css"/>
</head>
<body>
<div id="app">
  <div class="shell" tabindex="0">
    <canvas id="game" width="640" height="480" aria-label="Finding No-No-Namosh II game"></canvas>
    <div id="titleOverlay" class="overlay">
      <div class="panel title-panel" id="titlePanel"></div>
    </div>
    <div id="dialog" class="dialog hidden">
      <div id="speaker" class="speaker"></div>
      <div id="dialogText" class="dialog-text"></div>
      <div class="dialog-next">A / ENTER</div>
    </div>
    <div id="hud" class="hud hidden">
      <div><span id="areaName">—</span></div>
      <div id="questText">—</div>
      <div class="hud-row"><span id="hearts">♥♥♥</span><span id="abilityText"></span></div>
    </div>
    <div id="inventoryPanel" class="side-panel hidden">
      <div class="side-title" id="invTitle">Satchel</div>
      <div id="inventoryList"></div>
      <button id="closeInventory">Close</button>
    </div>
    <div class="touch-ui">
      <div class="dpad">
        <button data-dir="up">▲</button>
        <div><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div>
      </div>
      <div class="actions">
        <button id="btnA" class="big">A</button>
        <button id="btnB">B</button>
        <button id="btnBag">BAG</button>
      </div>
    </div>
  </div>
</div>
<script src="src/i18n.js"></script>
<script src="src/data.js"></script>
<script src="src/engine.js"></script>
<script src="src/game.js"></script>
</body>
</html>
