 en:{

  areas:{apt:'Aya’s Apartment',hall:'Apartment Hallway',rose:'Rosewood in the Rain',green1:'Greenhaven Road',green2:'Greenhaven Valley',green3:'Old Irrigation Fields',riverTown:'Riverside Settlement',inlet:'Training Inlet',riverCross:'The Great River',grotto1:'Crystalwater Grotto — Entrance',grotto2:'Crystalwater Grotto — Floodgate Hall',grotto3:'Crystalwater Grotto — Sunken Passage',grotto4:'Crystalwater Grotto — Star Chamber',grotto5:'Crystalwater Grotto — Escape Channel'},
  quests:{count:'Something feels wrong. Count the kittens.',hall:'Follow the tiny wet paw prints into the hallway.',rose:'Follow Namosh’s trail out of Rosewood.',green:'Cross Greenhaven and find where Namosh went.',abdullah:'Follow the marked trail south with Abdullah.',river:'Reach the Great River.',sami:'Speak with Sami the Fisherman about crossing the river.',lesson:'Complete Sami’s swimming lesson.',cross:'Cross the Great River and follow Namosh’s trail.',grotto:'Find a way through Crystalwater Grotto.',flood1:'Activate the first floodgate.',flood2:'Use the raised water to reach the second floodgate.',dive:'Find a way through the deep underwater passage.',star:'Investigate the Five-Point Star chamber.',escape:'Escape the flooding grotto.',complete:'The road to Azure Coast is open.'},
  items:{starShard:['Star Fragment','A warm, faintly glowing fragment found beside the kitten’s trail.'],whiteStone:['White-Stone Trail Mark','Abdullah marked the correct path through Greenhaven.'],herbs:['Greenhaven Herbs','Fresh herbs for Umm Zaynab.'],swimBadge:['River Knot','Sami’s little rope knot — proof Aya completed the swimming lesson.'],diveGoggles:['Old Diving Goggles','Repaired diving goggles from Crystalwater Grotto.'],crystal:['Cooling Crystal','A bright blue crystal humming with cold water energy.']},
  names:{Aya:'Aya',Namosh:'Namosh',Abdullah:'Abdullah',Netra:'Professor Netra',Sami:'Sami the Fisherman',Ahmed:'Ahmed',Farah:'Farah',UmmZ:'Umm Zaynab',Skuttan:'Dr. Meow Skuttan',Narrator:'Narrator'},
  dialog:{
   intro:[['Narrator','Several months after the first adventure, Aya’s apartment has become considerably louder.'],['Aya','One... two... three... four...'],['Aya','Namosh.'],['Aya','Where is number five?'],['Narrator','Namosh freezes. Her ears turn toward the apartment door.'],['Narrator','Thunder rolls outside. The lights flicker.'],['Narrator','Namosh scratches at the door — not playfully.'],['Aya','Oh absolutely not. We already did this.'],['Narrator','Aya opens the door. Tiny wet kitten paw prints lead down the hallway.'],['Namosh','MRRROW!'],['Narrator','Namosh bolts after them.'],['Aya','NAMOSH!']],
   hall:[['Narrator','The kitten’s tiny paw prints continue through the hallway and down the stairs.'],['Aya','At least this time I know why she is running.']],
   rose:[['Narrator','Rain has washed most of the tracks away, but fresh scratches mark the gate leading out of Rosewood.'],['Aya','She went toward Greenhaven. Of course she did.']],
   ahmed:[['Ahmed','Aya? I saw Namosh fly past like a tiny black-and-white storm.'],['Aya','Was she alone?'],['Ahmed','I saw smaller tracks too. They lead toward the old irrigation fields.']],
   farah:[['Farah','A cat scared my chickens half to death.'],['Aya','Black and white?'],['Farah','Very angry-looking.'],['Aya','That is new. She is usually only judgmental.']],
   ummz:[['Umm Zaynab','Habibti, the storm has made the lower road muddy. Take the high path by the herbs.'],['Aya','Thank you. If you see Namosh, tell her I am furious and worried in equal amounts.']],
   abdullah:[['Abdullah','Aya? Professor Netra sent me to check the strange activity near the observatory.'],['Aya','One of Namosh’s kittens is missing. Namosh went after her.'],['Abdullah','Then I am coming with you.'],['Aya','You say that now.'],['Abdullah','I remember the mountain.'],['Narrator','Abdullah places small white stones where the trail forks.']],
   shard:[['Narrator','Something glows faintly beside the kitten’s paw prints.'],['Aya','That definitely was not here yesterday.'],['Netra','Aya? Abdullah sent me the image. Do not lose that fragment. The marking matches the Old Observatory.'],['Aya','I am currently prioritizing a missing kitten.'],['Netra','I know. Unfortunately, I think the two problems may be connected.']],
   skuttanGreen:[['Skuttan','Ah. The fragment has already found you. How inconveniently efficient.'],['Aya','Why is there a British cat doing archaeology?'],['Skuttan','I could ask why you are.'],['Abdullah','At this point, I am not even surprised.'],['Skuttan','Dr. Meow Skuttan. Scholar, explorer, and — despite Professor Netra’s opinion — perfectly responsible around ancient objects.'],['Netra','Aya, do not let him touch the fragment.'],['Skuttan','Professor. How lovely to hear your confidence in me.'],['Aya','I do not like him.'],['Abdullah','You have known him for twelve seconds.'],['Narrator','Skuttan flicks his tail, adjusts his tiny satchel, and pads off toward the river.']],
   skuttanGrottoFirst:[['Skuttan','Extraordinary. A functioning hydraulic star chamber beneath the river.'],['Aya','Why is there a grey cat wearing glasses in this cave?'],['Skuttan','Dr. Meow Skuttan. Scholar and explorer. Do try to keep up.'],['Netra','Skuttan? Aya, do not let him touch anything ancient.'],['Skuttan','That is an absurdly broad restriction.'],['Aya','She sounds serious.'],['Skuttan','Professor Netra always does. I shall merely observe... from an extremely touchable distance.'],['Narrator','Before Aya can object, Skuttan slips toward another passage.']],
   skuttanGrotto:[['Skuttan','Extraordinary. A functioning hydraulic star chamber beneath the river.'],['Aya','How did you get down here before us?'],['Skuttan','Professional discretion.'],['Netra','Skuttan, do not touch anything ancient.'],['Skuttan','That is an absurdly broad restriction.'],['Aya','I am serious.'],['Skuttan','As am I. I shall merely observe... from an extremely touchable distance.'],['Narrator','By the time Aya looks back, Skuttan has already padded toward another passage.']],
   sami1:[['Sami','Aya! Back at the river?'],['Aya','I need to get across. Namosh and one of her kittens did somehow.'],['Sami','That current will carry you halfway to the sea if you enter it like that.'],['Aya','Helpful.'],['Sami','Come to the inlet. I will teach you how to read the current.']],
   sami2:[['Sami','Good. Keep your body with the current, not against it.'],['Aya','I crossed a mountain before learning this?'],['Sami','Apparently.'],['Narrator','Aya can now SWIM in marked water.']],
   grottoEnter:[['Narrator','The river current pulls Aya toward a crack beneath the waterfall.'],['Abdullah','AYA!'],['Narrator','They disappear beneath the white water and surface inside a vast glowing cavern.'],['Aya','I knew learning to swim would somehow make today worse.']],
   flood1:[['Narrator','Aya pulls the ancient lever. Deep inside the cave, stone gates grind open.'],['Narrator','Water rises through the lower chamber.'],['Abdullah','That opened a route above us.']],
   flood2:[['Narrator','The second floodgate shudders into place. A submerged tunnel becomes visible below.'],['Aya','Please tell me we are not going underwater.'],['Abdullah','We are definitely going underwater.']],
   goggles:[['Narrator','Abdullah finds a pair of old sealed goggles in a maintenance chest.'],['Abdullah','The rubber is somehow intact.'],['Aya','That sentence is not reassuring.'],['Narrator','Aya can now DIVE in deep water. Press B while swimming to dive or surface.']],
   star:[['Narrator','At the bottom of the grotto stands a colossal stone emblem. Five points surround a hollow center.'],['Netra','That is not a paw symbol. It is part of a five-site system.'],['Netra','The Old Observatory is one point. Crystalwater Grotto is another.'],['Aya','And the other three?'],['Netra','I do not know yet. But all five point toward Mount Qamar.'],['Aya','That sounds suspiciously like a future problem.']],
   escape:[['Narrator','The final mechanism cracks. Water begins pouring through the chamber.'],['Abdullah','RUN!'],['Aya','Finally, an instruction I understand.']],
   end:[['Narrator','Aya and Abdullah burst from the grotto into daylight. Far beyond the river, the road bends toward a bright blue coast.'],['Netra','The next marked site may lie beyond Azure Coast.'],['Skuttan','Azure Coast, you say? Splendid. I do enjoy fieldwork with a sea view.'],['Aya','You are not coming with us.'],['Narrator','Dr. Meow Skuttan is already walking toward the coast.'],['Aya','First I find Namosh. Then we discuss ancient civilizations.'],['Abdullah','You know those are probably the same quest now.'],['Aya','I was hoping you would not say that.']]
  }

  items:{starShard:['Stjärnfragment','Ett varmt, svagt glödande fragment som låg bredvid kattungens spår.'],whiteStone:['Vit stenmarkering','Abdullah markerade rätt väg genom Greenhaven.'],herbs:['Greenhaven-örter','Färska örter till Umm Zaynab.'],swimBadge:['Flodknut','Samis lilla repknut — bevis på att Aya klarade simlektionen.'],diveGoggles:['Gamla dykglasögon','Reparerade dykglasögon från Crystalwater Grotto.'],crystal:['Kylkristall','En klarblå kristall som vibrerar av kall vattenenergi.']},
  names:{Aya:'Aya',Namosh:'Namosh',Abdullah:'Abdullah',Netra:'Professor Netra',Sami:'Sami the Fisherman',Ahmed:'Ahmed',Farah:'Farah',UmmZ:'Umm Zaynab',Skuttan:'Dr. Meow Skuttan',Narrator:'Berättare'},
  dialog:{
   intro:[['Narrator','Flera månader efter det första äventyret har Ayas lägenhet blivit betydligt mer högljudd.'],['Aya','En... två... tre... fyra...'],['Aya','Namosh.'],['Aya','Var är nummer fem?'],['Narrator','Namosh stelnar till. Öronen vrids mot ytterdörren.'],['Narrator','Åskan mullrar utanför. Lamporna blinkar.'],['Narrator','Namosh krafsar på dörren — inte lekfullt.'],['Aya','Åh absolut inte. Det här har vi redan gjort.'],['Narrator','Aya öppnar dörren. Små våta tassavtryck leder genom trapphuset.'],['Namosh','MRRROW!'],['Narrator','Namosh rusar efter dem.'],['Aya','NAMOSH!']],
   hall:[['Narrator','Kattungens små tassavtryck fortsätter genom trapphuset och nerför trapporna.'],['Aya','Åtminstone vet jag varför hon springer den här gången.']],
   rose:[['Narrator','Regnet har sköljt bort nästan alla spår, men färska rivmärken syns på grinden ut från Rosewood.'],['Aya','Hon gick mot Greenhaven. Självklart gjorde hon det.']],
   ahmed:[['Ahmed','Aya? Jag såg Namosh rusa förbi som en liten svartvit storm.'],['Aya','Var hon ensam?'],['Ahmed','Jag såg mindre spår också. De leder mot de gamla bevattningsfälten.']],
   farah:[['Farah','En katt skrämde nästan ihjäl mina höns.'],['Aya','Svartvit?'],['Farah','Såg väldigt arg ut.'],['Aya','Det är nytt. Vanligtvis är hon bara dömande.']],
   ummz:[['Umm Zaynab','Habibti, stormen har gjort den nedre vägen lerig. Ta den övre vägen vid örterna.'],['Aya','Tack. Om du ser Namosh, säg att jag är lika delar arg och orolig.']],
   abdullah:[['Abdullah','Aya? Professor Netra skickade mig för att undersöka den konstiga aktiviteten vid observatoriet.'],['Aya','En av Namoshs kattungar är borta. Namosh sprang efter henne.'],['Abdullah','Då följer jag med dig.'],['Aya','Det säger du nu.'],['Abdullah','Jag minns berget.'],['Narrator','Abdullah lägger små vita stenar där leden delar sig.']],
   shard:[['Narrator','Något glöder svagt bredvid kattungens tassavtryck.'],['Aya','Det där låg definitivt inte här igår.'],['Netra','Aya? Abdullah skickade bilden. Tappa inte fragmentet. Märkningen matchar det gamla observatoriet.'],['Aya','Just nu prioriterar jag en försvunnen kattunge.'],['Netra','Jag vet. Tyvärr tror jag att problemen hänger ihop.']],
   skuttanGreen:[['Skuttan','Ah. Fragmentet har redan hittat dig. Obehagligt effektivt.'],['Aya','Varför håller en brittisk katt på med arkeologi?'],['Skuttan','Jag skulle kunna fråga varför du gör det.'],['Abdullah','Vid det här laget är jag inte ens förvånad.'],['Skuttan','Dr. Meow Skuttan. Forskare, upptäcktsresande och — trots Professor Netras åsikt — fullständigt ansvarsfull kring gamla föremål.'],['Netra','Aya, låt honom inte röra fragmentet.'],['Skuttan','Professor. Så trevligt att höra ditt förtroende för mig.'],['Aya','Jag gillar honom inte.'],['Abdullah','Du har känt honom i tolv sekunder.'],['Narrator','Skuttan viftar på svansen, rättar till sin lilla väska och tassar iväg mot floden.']],
   skuttanGrottoFirst:[['Skuttan','Enastående. En fungerande hydraulisk stjärnkammare under floden.'],['Aya','Varför finns det en grå katt med glasögon i den här grottan?'],['Skuttan','Dr. Meow Skuttan. Forskare och upptäcktsresande. Försök hänga med.'],['Netra','Skuttan? Aya, låt honom inte röra något gammalt.'],['Skuttan','Det är en löjligt bred begränsning.'],['Aya','Hon låter allvarlig.'],['Skuttan','Professor Netra gör alltid det. Jag ska bara observera... från ett extremt berörbart avstånd.'],['Narrator','Innan Aya hinner protestera smiter Skuttan mot en annan passage.']],
   skuttanGrotto:[['Skuttan','Enastående. En fungerande hydraulisk stjärnkammare under floden.'],['Aya','Hur tog du dig hit före oss?'],['Skuttan','Yrkeshemlighet.'],['Netra','Skuttan, rör inget gammalt.'],['Skuttan','Det är en löjligt bred begränsning.'],['Aya','Jag menar allvar.'],['Skuttan','Det gör jag också. Jag ska bara observera... från ett extremt berörbart avstånd.'],['Narrator','När Aya tittar tillbaka har Skuttan redan tassat vidare mot en annan passage.']],
   sami1:[['Sami','Aya! Tillbaka vid floden?'],['Aya','Jag måste över. Namosh och en av kattungarna lyckades tydligen.'],['Sami','Den strömmen skickar dig halvvägs till havet om du går i så där.'],['Aya','Hjälpsamt.'],['Sami','Kom till viken. Jag lär dig läsa strömmen.']],
   sami2:[['Sami','Bra. Följ strömmen med kroppen, kämpa inte rakt emot den.'],['Aya','Jag korsade ett berg innan jag lärde mig det här?'],['Sami','Tydligen.'],['Narrator','Aya kan nu SIMMA i markerat vatten.']],
   grottoEnter:[['Narrator','Flodströmmen drar Aya mot en spricka under vattenfallet.'],['Abdullah','AYA!'],['Narrator','De försvinner under det vita vattnet och kommer upp i en enorm lysande grotta.'],['Aya','Jag visste att simkunskaper på något sätt skulle göra dagen värre.']],
   flood1:[['Narrator','Aya drar i den gamla spaken. Djupt inne i grottan börjar stenportar mala.'],['Narrator','Vattnet stiger genom den nedre kammaren.'],['Abdullah','Det öppnade en väg ovanför oss.']],
   flood2:[['Narrator','Den andra slussen skakar på plats. En nedsänkt tunnel blir synlig nedanför.'],['Aya','Säg inte att vi ska under vattnet.'],['Abdullah','Vi ska definitivt under vattnet.']],
   goggles:[['Narrator','Abdullah hittar ett par gamla täta glasögon i en underhållskista.'],['Abdullah','Gummit är på något sätt fortfarande helt.'],['Aya','Den meningen gör mig inte lugnare.'],['Narrator','Aya kan nu DYKA i djupt vatten. Tryck B medan du simmar för att dyka eller gå upp till ytan.']],
   star:[['Narrator','På grottans botten står ett enormt stenemblem. Fem spetsar omger ett tomt centrum.'],['Netra','Det där är ingen tassymbol. Det är en del av ett system med fem platser.'],['Netra','Det gamla observatoriet är en punkt. Crystalwater Grotto är en annan.'],['Aya','Och de andra tre?'],['Netra','Det vet jag inte än. Men alla fem pekar mot Mount Qamar.'],['Aya','Det låter misstänkt mycket som ett framtida problem.']],
   escape:[['Narrator','Den sista mekanismen spricker. Vatten forsar in i kammaren.'],['Abdullah','SPRING!'],['Aya','Äntligen en instruktion jag förstår.']],
   end:[['Narrator','Aya och Abdullah kastar sig ut ur grottan i dagsljuset. På andra sidan floden böjer vägen av mot en klarblå kust.'],['Netra','Nästa markerade plats kan ligga bortom Azure Coast.'],['Skuttan','Azure Coast, säger du? Utmärkt. Jag uppskattar fältarbete med havsutsikt.'],['Aya','Du följer inte med oss.'],['Narrator','Dr. Meow Skuttan är redan på väg mot kusten.'],['Aya','Först hittar jag Namosh. Sedan pratar vi om gamla civilisationer.'],['Abdullah','Du vet att det förmodligen är samma uppdrag nu.'],['Aya','Jag hoppades att du inte skulle säga det.']]
  }
 }

// ---------- Dialog ----------
let q=[],done=null;
N2.dialog=function(rows,cb){q=[...rows];done=cb||null;$('#dialog').classList.remove('hidden');N2.nextDialog()};
N2.nextDialog=function(){if(q.length){const [sp,tx,key]=q.shift();$('#speaker').textContent=sp;$('#dialogText').textContent=tx;drawPortrait(key||speakerKeyFromName(sp))}else{$('#dialog').classList.add('hidden');$('#portraitBox')?.classList.add('hidden');const cb=done;done=null;if(cb)cb();N2.draw()}};

// ---------- Inventory / save ----------
N2.addItem=function(key){if(!N2.state.inventory.includes(key))N2.state.inventory.push(key);N2.renderInventory();N2.save()};
N2.renderInventory=function(){const box=$('#inventoryList');box.innerHTML='';N2.state.inventory.forEach(k=>{const [n,d]=N2.t('items.'+k);const el=document.createElement('div');el.className='item';el.innerHTML=`<strong>${n}</strong><span>${d}</span>`;box.appendChild(el)});if(!N2.state.inventory.length)box.textContent=N2.lang==='sv'?'Väskan är tom.':'The satchel is empty.';$('#invTitle').textContent=N2.t('ui.satchel');$('#closeInventory').textContent=N2.t('ui.close')};
N2.openInventory=()=>{N2.renderInventory();$('#inventoryPanel').classList.remove('hidden')};
N2.save=function(){try{localStorage.setItem('namosh2-save',JSON.stringify(N2.state));localStorage.setItem('namosh2-lang',N2.lang)}catch(e){}};
N2.load=function(){try{const raw=localStorage.getItem('namosh2-save');if(!raw)return false;N2.state={...N2.fresh(),...JSON.parse(raw)};N2.lang=N2.state.lang||localStorage.getItem('namosh2-lang')||'en';return true}catch(e){return false}};

// ---------- Audio ----------
let ac=null,timer=null,step=0,theme='field';
N2.startAudio=function(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();if(timer)return;const notes=[392,440,493.88,523.25,493.88,440,392,349.23,329.63,349.23,392,440,493.88,440,392,349.23];const cave=[261.63,293.66,329.63,349.23,329.63,293.66,261.63,246.94];function tone(f,type,g,d){const o=ac.createOscillator(),v=ac.createGain(),n=ac.currentTime;o.type=type;o.frequency.value=f;v.gain.setValueAtTime(.0001,n);v.gain.exponentialRampToValueAtTime(g,n+.03);v.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(v);v.connect(ac.destination);o.start();o.stop(n+d+.04)}timer=setInterval(()=>{if(ac.state!=='running')return;theme=area().theme;const arr=['grotto','star'].includes(theme)?cave:notes,f=arr[step%arr.length];tone(f,'triangle',.018,.38);if(step%4===0)tone(f/4,'sine',.008,.7);step++},330)}catch(e){}};
N2.sfx=function(kind){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type='square';o.frequency.value=kind==='step'?130:kind==='item'?720:220;g.gain.setValueAtTime(.004,n);g.gain.exponentialRampToValueAtTime(.0001,n+.07);o.connect(g);g.connect(ac.destination);o.start();o.stop(n+.08)};

// expose sprite funcs for cutscenes
N2.drawAya=drawAya;N2.drawNamosh=drawNamosh;N2.drawKitten=drawKitten;N2.drawSkuttan=drawSkuttan;N2.drawNpc=drawNpc;
})();

<script>
window.N2=window.N2||{};
(()=>{
const $=N2.$,R=N2.R,{W,H,T}=N2.CFG;
function rows(key){return N2.t('dialog.'+key).map(([s,t])=>[N2.t('names.'+s),t,s])}
function titleScreen(){
  $('#hud').classList.add('hidden');$('#dialog').classList.add('hidden');$('#portraitBox')?.classList.add('hidden');$('#inventoryPanel').classList.add('hidden');$('#titleOverlay').classList.remove('hidden');
  const canContinue=!!localStorage.getItem('namosh2-save');
  $('#titlePanel').innerHTML=`<div class="small-note">${N2.t('ui.part1')}</div><div class="logo">${N2.t('ui.title')}</div><div class="subtitle">${N2.t('ui.subtitle')}</div><div class="lang-buttons"><button id="langEn">ENGLISH</button><button id="langSv">SVENSKA</button></div><div class="menu"><button id="newBtn">${N2.t('ui.newGame')}</button>${canContinue?`<button id="continueBtn">${N2.t('ui.continue')}</button>`:''}</div><div class="small-note">A larger retro adventure · swimming · caves · companions</div>`;
  $('#langEn').onclick=()=>{N2.lang='en';localStorage.setItem('namosh2-lang','en');titleScreen()};
  $('#langSv').onclick=()=>{N2.lang='sv';localStorage.setItem('namosh2-lang','sv');titleScreen()};
  $('#newBtn').onclick=()=>{N2.startAudio();N2.state=N2.fresh();N2.state.lang=N2.lang;localStorage.removeItem('namosh2-save');$('#titleOverlay').classList.add('hidden');$('#hud').classList.remove('hidden');playIntro()};
  const c=$('#continueBtn');if(c)c.onclick=()=>{N2.startAudio();if(N2.load()){N2.state.lang=N2.lang;$('#titleOverlay').classList.add('hidden');$('#hud').classList.remove('hidden');N2.renderInventory();N2.draw()}};
  drawTitleBackdrop();
}
function drawTitleBackdrop(){
 R(0,0,640,480,'#6fae77');R(0,320,640,160,'#9dc98a');R(0,375,640,105,'#70b9e5');
 for(let i=0;i<20;i++){R((i*91)%620,310-((i*37)%90),18,34,'#477b55');R((i*91)%620-8,300-((i*37)%90),34,22,'#78b46d')}
 N2.drawAya(160,315,'right',2,false,false);N2.drawNamosh(410,340,2);
}
function drawIntroFrame(i){
 R(0,0,640,480,'#b98962');
 R(0,0,640,45,'#d8c7aa');R(0,435,640,45,'#876c52');R(0,0,45,480,'#d8c7aa');R(595,0,45,480,'#d8c7aa');
 R(430,70,120,210,'#ece5d6');R(438,78,104,55,'#fff8eb');R(438,140,104,132,'#88847f');
 R(70,80,180,80,'#f0e9dc');R(70,160,180,20,'#4e514b');
 // window with storm
 R(290,55,105,95,'#45576b');R(300,65,85,75,'#6b8096');
 for(let k=0;k<10;k++){R(305+k*9,70+(k%3)*18,2,22,'#a9d7ef')}
 if(i>=5){R(335,66,5,55,'#fff1a5');R(325,102,24,5,'#fff1a5')}
 // Aya near kittens
 N2.drawAya(255,285,'right',1,false,false);
 // Namosh tense by door later
 if(i<4)N2.drawNamosh(320,300,1);else N2.drawNamosh(470,300,1);
 const kittens=[[130,320],[180,335],[220,300],[370,335]];kittens.forEach(([x,y])=>N2.drawKitten(x,y));
 if(i<2)N2.drawKitten(420,275);
 // hallway door
 R(515,180,55,140,'#6e5947');R(525,192,35,118,'#8d725a');R(552,250,4,4,'#e4c57a');
}
function playSequence(list,scene,done){let i=0;const step=()=>{scene?.(i);N2.dialog([list[i]],()=>{i++;if(i<list.length)step();else done?.()})};step()}
function playIntro(){
  const list=rows('intro');
  playSequence(list,drawIntroFrame,()=>{
    N2.state.flags.introDone=true;N2.state.map='hall';N2.state.x=10;N2.state.y=12;N2.state.dir='up';N2.state.quest='hall';N2.save();N2.draw();
  });
}
function showEnd(){
  $('#titleOverlay').classList.remove('hidden');$('#hud').classList.add('hidden');
  $('#titlePanel').innerHTML=`<div class="small-note">${N2.t('ui.part1')}</div><div class="logo">${N2.t('ui.demoEnd')}</div><div class="subtitle">${N2.t('ui.demoMsg')}</div><div class="menu"><button id="backTitle">TITLE / TITEL</button></div>`;
  $('#backTitle').onclick=titleScreen;
}
function startPartner(){N2.state.partner={name:'Abdullah',look:'abdullah',map:N2.state.map,x:N2.state.x-1,y:N2.state.y};N2.state.flags.abdullahJoined=true}
function findTarget(){const [x,y]=N2.target(),m=N2.area();const n=(m.npcs||[]).find(n=>N2.npcVisible(n)&&n.x===x&&n.y===y);let o=(m.objects||[]).find(o=>N2.objVisible(o)&&o.x===x&&o.y===y);if(!o)o=(m.objects||[]).find(o=>N2.objVisible(o)&&o.x===N2.state.x&&o.y===N2.state.y&&['paws','sparkle','herb','stones','foam','exit'].includes(o.type));return {n,o,x,y}}
function talkNpc(n){
 const f=N2.state.flags;
 if(n.id==='ahmed'){N2.dialog(rows('ahmed'),()=>{f.ahmed=true;N2.state.quest='green';N2.save()});return}
 if(n.id==='farah'){N2.dialog(rows('farah'));return}
 if(n.id==='ummz'){N2.dialog(rows('ummz'));return}
 if(n.id==='skuttan'){
   N2.dialog(rows('skuttanGreen'),()=>{f.skuttanMet=true;f.skuttanLeftGreenhaven=true;N2.save();N2.draw()});return;
 }
 if(n.id==='skuttanGrotto'){
   const key=f.skuttanMet?'skuttanGrotto':'skuttanGrottoFirst';
   N2.dialog(rows(key),()=>{f.skuttanMet=true;f.skuttanGrottoSeen=true;f.skuttanLeftGrotto=true;N2.save();N2.draw()});return;
 }
 if(n.id==='abdullah'){
   if(!f.abdullahJoined)N2.dialog(rows('abdullah'),()=>{startPartner();N2.addItem('whiteStone');N2.state.quest='abdullah';N2.save();N2.draw()});
   else N2.dialog([[N2.t('names.Abdullah'),N2.lang==='sv'?'Jag följer de små spåren. Fortsätt söderut.':'I am following the smaller prints. Keep heading south.']]);
   return;
 }
 if(n.id==='sami'){
   if(!N2.state.abilities.swim)N2.dialog(rows('sami1'),()=>{f.samiTalked=true;N2.state.quest='lesson';N2.save()});
   else N2.dialog([[N2.t('names.Sami'),N2.lang==='sv'?'Bra. Nu kan floden inte stoppa dig.':'Good. The river cannot stop you now.']]);
   return;
 }
 if(n.id==='samiLesson'){
   if(!N2.state.abilities.swim){N2.state.abilities.swim=true;N2.dialog(rows('sami2'),()=>{N2.state.quest='lesson';N2.save();N2.draw()})}
   else N2.dialog([[N2.t('names.Sami'),N2.lang==='sv'?'Simma ut till den röda bojen och tillbaka.':'Swim out to the red buoy and back.']]);
   return;
 }
}
function interactObject(o){
 const f=N2.state.flags;
 if(o.id==='wetPaws'){N2.dialog(rows('hall'),()=>{f.hallClue=true;N2.state.quest='rose';N2.save()});return}
 if(o.id==='roseScratch'){N2.dialog(rows('rose'),()=>{f.roseClue=true;N2.state.quest='green';N2.save()});return}
 if(o.id==='shard'&&!f['done:shard']){f['done:shard']=true;N2.addItem('starShard');N2.dialog(rows('shard'),()=>{N2.save();N2.draw()});return}
 if(o.id.startsWith('herb')){f['done:'+o.id]=true;f.herbs=(f.herbs||0)+1;if(f.herbs===3)N2.addItem('herbs');N2.sfx('item');N2.draw();return}
 if(o.id==='whiteStones'){N2.dialog([[N2.t('names.Narrator'),N2.lang==='sv'?'Små vita stenar markerar den torrare vägen mot floden. Abdullah håller sitt ord.':'Small white stones mark the drier path toward the river. Abdullah is keeping his word.']]);return}
 if(o.id==='riverSign'){N2.dialog([[N2.t('names.Narrator'),N2.lang==='sv'?'SKYLT: Starka strömmar. Simma inte utan erfarenhet.':'SIGN: Strong current. Do not enter without experience.']]);return}
 if(o.id==='lessonBuoy'){
   if(N2.state.abilities.swim&&!f.swimLessonDone){f.swimLessonDone=true;N2.addItem('swimBadge');N2.state.quest='cross';N2.dialog([[N2.t('names.Narrator'),N2.lang==='sv'?'Aya rundar bojen och håller sig stadigt i strömmen. Simlektionen är klar.':'Aya rounds the buoy and holds steady in the current. Swimming lesson complete.']],()=>N2.save())}
   return;
 }
 if(o.id==='grottoPaws'){N2.dialog([[N2.t('names.Aya'),N2.lang==='sv'?'Namoshs tassavtryck. Hon tog sig igenom här.':'Namosh’s paw prints. She made it through here.']]);return}
 if(o.id==='lever1'&&!f.flood1){f.flood1=true;N2.dialog(rows('flood1'),()=>{N2.state.quest='flood2';N2.save();N2.draw()});return}
 if(o.id==='lever2'&&!f.flood2){f.flood2=true;N2.dialog(rows('flood2'),()=>{N2.state.quest='dive';N2.save();N2.draw()});return}
 if(o.id==='goggles'&&!N2.state.abilities.dive){f['done:goggles']=true;N2.state.abilities.dive=true;N2.addItem('diveGoggles');N2.dialog(rows('goggles'),()=>{N2.state.quest='dive';N2.save();N2.draw()});return}
 if(o.id==='starEmblem'&&!f.starSeen){f.starSeen=true;N2.dialog(rows('star'),()=>{N2.state.quest='escape';N2.save();N2.draw()});return}
 if(o.id==='coolCrystal'&&!f['done:coolCrystal']){f['done:coolCrystal']=true;N2.addItem('crystal');N2.dialog([[N2.t('names.Narrator'),N2.lang==='sv'?'Aya tar loss en iskall blå kristall från väggen.':'Aya carefully removes an ice-cold blue crystal from the wall.']]);N2.draw();return}
 if(o.id==='exitLight'&&!f.chapterComplete){f.chapterComplete=true;N2.dialog(rows('escape'),()=>playSequence(rows('end'),null,()=>{N2.state.quest='complete';N2.state.finished=true;N2.save();showEnd()}));return}
 if(o.type==='kitten'){N2.dialog([[N2.t('names.Aya'),N2.lang==='sv'?'Du är här. Bra. Fyra... vänta. Fortfarande bara fyra.':'You are here. Good. Four... wait. Still only four.']]);return}
 if(o.id==='bowl'){N2.dialog([[N2.t('names.Aya'),N2.lang==='sv'?'Sex matskålar. Mitt liv har förändrats väldigt snabbt.':'Six food bowls. My life changed very quickly.']]);return}
 if(o.id==='bed'){N2.dialog([[N2.t('names.Aya'),N2.lang==='sv'?'En gång hade jag en hel säng.':'I used to own an entire bed.']]);return}
}
N2.interact=function(){
 if(!$('#dialog').classList.contains('hidden')){N2.nextDialog();return}
 if(!$('#inventoryPanel').classList.contains('hidden'))return;
 const {n,o}=findTarget();if(n){talkNpc(n);return}if(o){interactObject(o);return}
 if(N2.state.partner){const [tx,ty]=N2.target(),p=N2.state.partner;if(p.map===N2.state.map&&p.x===tx&&p.y===ty){N2.dialog([[N2.t('names.Abdullah'),N2.lang==='sv'?'Jag är med dig. Fortsätt följa spåren.':'I am with you. Keep following the trail.']]);return}}
 N2.dialog([[N2.t('names.Aya'),N2.lang==='sv'?'Inget här.':'Nothing here.']]);
};
N2.toggleDive=function(){
 if(N2.state.abilities.dive&&N2.inWater()){
   N2.state.diving=!N2.state.diving;N2.sfx('item');N2.draw();return;
 }
 N2.openInventory();
};
N2.onEnter=function(id){
 const f=N2.state.flags;
 if(id==='rose'&&!f.enterRose){f.enterRose=true;N2.state.quest='rose'}
 if(id==='green1')N2.state.quest='green';
 if(id==='green2'&&!f.abdullahJoined)N2.state.quest='green';
 if(id==='riverTown'&&!N2.state.abilities.swim)N2.state.quest='sami';
 if(id==='riverCross')N2.state.quest='cross';
 if(id==='grotto1'&&!f.grottoIntro){f.grottoIntro=true;N2.state.quest='grotto';setTimeout(()=>N2.dialog(rows('grottoEnter')),100)}
 if(id==='grotto2'&&!f.flood1)N2.state.quest='flood1';
 if(id==='grotto3'&&f.flood1&&!f.flood2)N2.state.quest='flood2';
 if(id==='grotto4'&&!f.starSeen)N2.state.quest='star';
 if(id==='grotto5')N2.state.quest='escape';
 N2.save();
};
// controls
$('[data-dir="up"]').onclick=()=>N2.move(0,-1,'up');$('[data-dir="down"]').onclick=()=>N2.move(0,1,'down');$('[data-dir="left"]').onclick=()=>N2.move(-1,0,'left');$('[data-dir="right"]').onclick=()=>N2.move(1,0,'right');
$('#btnA').onclick=N2.interact;$('#btnB').onclick=N2.toggleDive;$('#btnBag').onclick=N2.openInventory;$('#closeInventory').onclick=()=>$('#inventoryPanel').classList.add('hidden');
document.querySelector('.shell').addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d','enter',' ','b','i','escape'].includes(k))e.preventDefault();if(k==='arrowup'||k==='w')N2.move(0,-1,'up');else if(k==='arrowdown'||k==='s')N2.move(0,1,'down');else if(k==='arrowleft'||k==='a')N2.move(-1,0,'left');else if(k==='arrowright'||k==='d')N2.move(1,0,'right');else if(k==='enter'||k===' ')N2.interact();else if(k==='b')N2.toggleDive();else if(k==='i')N2.openInventory();else if(k==='escape')$('#inventoryPanel').classList.add('hidden')});
const savedLang=localStorage.getItem('namosh2-lang');if(savedLang&&N2.I18N[savedLang])N2.lang=savedLang;titleScreen();
})();

</script>
</body>
</html>
